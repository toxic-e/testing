<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="theme-color" content="#ec4899"/>
  <title>What's New — Techofy Cloud</title>
  
  <meta name="description" content="What's New at Techofy Cloud. Stay updated with our latest features, server upgrades, patches, and announcements for VPS and RDP hosting." />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Techofy Cloud" />
  <link rel="canonical" href="https://techofy.xyz/updates"/>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://techofy.xyz/updates" />
  <meta property="og:title" content="What's New — Techofy Cloud" />
  <meta property="og:description" content="Discover what's new at Techofy Cloud. Check out our latest hosting features, system upgrades, and platform announcements." />
  <meta property="og:site_name" content="Techofy Cloud" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="What's New — Techofy Cloud" />
  <meta name="twitter:description" content="Stay in the loop with the newest product updates and improvements from Techofy Cloud." />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Techofy Cloud",
    "url": "https://techofy.xyz/"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--pink:#f472b6;--pink-deep:#ec4899;--pink-soft:#fce7f3;--pink-pale:#fdf2f8;--pink-border:rgba(236,72,153,.18);--text:#111;--text-2:#555;--text-3:#999;--border:rgba(0,0,0,.08);--r-md:14px;--r-lg:20px;--r-full:999px;--shadow-lg:0 12px 48px rgba(0,0,0,.1);--spring:cubic-bezier(.34,1.56,.64,1);}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
    body{font-family:'Sora',sans-serif;background:linear-gradient(160deg,#fff 0%,#fdf2f8 55%,#fce7f3 100%);min-height:100vh;-webkit-font-smoothing:antialiased;}
    a{color:var(--pink-deep);text-decoration:none;}
    button{font-family:inherit;cursor:pointer;border:none;background:none;}
    .hidden{display:none!important;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
    @keyframes spin{to{transform:rotate(360deg);}}

    .navbar{position:fixed;top:0;left:0;right:0;z-index:100;height:58px;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(0,0,0,.06);}
    .nav-inner{max-width:1100px;margin:0 auto;padding:0 16px;height:100%;display:flex;align-items:center;gap:8px;}
    .logo{font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;flex-shrink:0;}
    .logo-icon{width:20px;height:20px;flex-shrink:0;}
    .nav-back{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--pink-deep);display:flex;align-items:center;gap:4px;padding:7px 14px;border:1.5px solid var(--pink-border);border-radius:var(--r-full);transition:all .2s;white-space:nowrap;flex-shrink:0;}
    .nav-back:hover{background:var(--pink-soft);}

    .main{min-height:100vh;padding-top:calc(58px + 40px);padding-bottom:60px;padding-left:16px;padding-right:16px;display:flex;flex-direction:column;align-items:center;}

    .page-header{text-align:center;margin-bottom:28px;animation:fadeUp .6s var(--spring) forwards;width:100%;max-width:680px;}
    .page-badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--pink-deep);background:rgba(236,72,153,.08);border:1px solid var(--pink-border);padding:5px 13px;border-radius:var(--r-full);margin-bottom:12px;}
    .page-title{font-size:clamp(26px,6vw,44px);font-weight:800;letter-spacing:-1.5px;color:var(--text);margin-bottom:8px;}
    .page-sub{font-size:14px;color:var(--text-2);line-height:1.5;padding:0 4px;}

    /* Single update view */
    .update-card{width:100%;max-width:680px;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-lg);animation:fadeUp .5s var(--spring) forwards;}
    .update-head{background:linear-gradient(135deg,var(--pink-deep),#c026d3);padding:24px 24px 20px;}
    .update-slug{font-size:11px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
    .update-title-text{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1.2;}
    .update-date{font-size:12px;color:rgba(255,255,255,.65);margin-top:6px;}
    .update-body{padding:24px;}
    .update-content{font-size:14.5px;color:var(--text-2);line-height:1.85;white-space:pre-wrap;word-break:break-word;}
    .update-content p{margin-bottom:12px;}
    .back-btn{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:13px;font-weight:600;color:var(--pink-deep);padding:9px 18px;border:1.5px solid var(--pink-border);border-radius:var(--r-full);transition:all .2s;}
    .back-btn:hover{background:var(--pink-soft);}

    /* Updates list */
    .updates-list{width:100%;max-width:680px;display:flex;flex-direction:column;gap:14px;}
    .list-item{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:18px 20px;box-shadow:0 2px 12px rgba(0,0,0,.05);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .list-item:hover{border-color:var(--pink-border);box-shadow:var(--shadow-lg);transform:translateY(-1px);}
    .list-item-left{}
    .list-item-slug{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;}
    .list-item-date{font-size:11.5px;color:var(--text-3);}
    .list-item-arrow{color:var(--pink-deep);font-size:18px;flex-shrink:0;}

    /* Loading */
    .loading-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px;color:var(--text-3);}
    .spin{width:24px;height:24px;border:3px solid rgba(236,72,153,.2);border-top-color:var(--pink-deep);border-radius:50%;animation:spin .7s linear infinite;}

    /* Error / Empty */
    .empty-wrap{text-align:center;padding:48px 24px;}
    .empty-icon{font-size:40px;margin-bottom:12px;}
    .empty-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;}
    .empty-sub{font-size:14px;color:var(--text-3);}

    /* Share URL */
    .url-box{background:var(--pink-pale);border:1px solid var(--pink-border);border-radius:10px;padding:10px 14px;margin-top:14px;display:flex;align-items:center;gap:8px;cursor:pointer;}
    .url-box span{font-size:12px;font-family:monospace;color:var(--pink-deep);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .url-box button{font-size:11.5px;font-weight:700;color:#fff;background:var(--pink-deep);padding:4px 12px;border-radius:var(--r-full);flex-shrink:0;}

    .page-footer{margin-top:40px;text-align:center;font-size:12px;color:var(--text-3);}
    .page-footer a{color:var(--pink-deep);font-weight:600;margin:0 4px;}
  </style>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="logo">
      <img src="/favicon.svg" alt="" class="logo-icon" onerror="this.style.display='none'"/>
      Techofy Cloud
    </a>
    <a href="/" class="nav-back">← Home</a>
  </div>
</nav>
<main class="main">
  <div class="page-header">
    <div class="page-badge">Changelog</div>
    <h1 class="page-title" id="pageTitle">What's New</h1>
    <p class="page-sub" id="pageSub">Stay up to date with the latest features, fixes, and improvements.</p>
  </div>

  <div id="loadingView" class="loading-wrap">
    <div class="spin"></div>
    <p>Loading...</p>
  </div>

  <div id="updateView" class="update-card hidden"></div>

  <div id="listView" class="updates-list hidden"></div>

  <div id="emptyView" class="empty-wrap hidden">
    <div class="empty-icon">📭</div>
    <div class="empty-title">No updates found</div>
    <div class="empty-sub">Check back soon for the latest news.</div>
  </div>

  <div class="page-footer">
    <a href="/">Home</a> · <a href="/tracking">Track Order</a> · <a href="mailto:support@techofy.xyz">Support</a>
  </div>
</main>

<script>
const API_BASE = 'https://e-dev.fun';

function formatDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('en-IN', {
    year: 'numeric', month: 'long', day: 'numeric',
    timeZone: 'Asia/Kolkata',
  });
}

function formatContent(text) {
  // Convert plain text to paragraphs
  return text.split(/\n\n+/).map(para =>
    '<p>' + para.replace(/\n/g, '<br/>') + '</p>'
  ).join('');
}

function copyUrl(url) {
  navigator.clipboard?.writeText(url).catch(() => {});
  const btn = document.getElementById('copyBtn');
  if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 2000); }
}

function showSingleUpdate(update) {
  const slug = update.slug;
  const url = `${window.location.origin}/updates?${slug}`;

  document.getElementById('pageTitle').textContent = `Update: ${slug}`;
  document.getElementById('pageSub').textContent = `Posted on ${formatDate(update.createdAt)}`;
  document.title = `Update ${slug} — Techofy Cloud`;

  const view = document.getElementById('updateView');
  view.innerHTML = `
    <div class="update-head">
      <div class="update-slug">📄 ${slug}</div>
      <div class="update-title-text">Release Notes</div>
      <div class="update-date">${formatDate(update.createdAt)}${update.updatedAt && update.updatedAt !== update.createdAt ? ' · Updated ' + formatDate(update.updatedAt) : ''}</div>
    </div>
    <div class="update-body">
      <div class="update-content">${formatContent(update.content)}</div>
      <div class="url-box" onclick="copyUrl('${url}')">
        <span>${url}</span>
        <button id="copyBtn">Copy</button>
      </div>
      <a href="/updates" class="back-btn">← All Updates</a>
    </div>`;

  document.getElementById('loadingView').classList.add('hidden');
  view.classList.remove('hidden');
}

function showUpdatesList(updates) {
  if (!updates.length) {
    document.getElementById('loadingView').classList.add('hidden');
    document.getElementById('emptyView').classList.remove('hidden');
    return;
  }
  const list = document.getElementById('listView');
  list.innerHTML = updates.map(u => `
    <div class="list-item" onclick="window.location='/updates?${u.slug}'">
      <div class="list-item-left">
        <div class="list-item-slug">📄 ${u.slug}</div>
        <div class="list-item-date">${formatDate(u.createdAt || u.updatedAt)}</div>
      </div>
      <div class="list-item-arrow">›</div>
    </div>`
  ).join('');
  document.getElementById('loadingView').classList.add('hidden');
  list.classList.remove('hidden');
}

async function init() {
  // Parse slug from query string: /updates?v1.2 or /updates?slug=v1.2
  const search = window.location.search;
  let slug = '';
  if (search && search.length > 1) {
    const raw = search.slice(1); // remove '?'
    // Check if it's key=value or just a plain slug
    if (raw.includes('=')) {
      const params = new URLSearchParams(search);
      slug = params.get('slug') || params.get('id') || params.get('name') || raw.split('=')[1] || '';
    } else {
      slug = raw; // plain slug: /updates?v1.2
    }
    slug = slug.trim();
  }

  // Also check hash: /updates#v1.2
  if (!slug && window.location.hash && window.location.hash.length > 1) {
    slug = window.location.hash.slice(1);
  }

  if (slug) {
    // Load single update
    try {
      const res = await fetch(`${API_BASE}/api/updates/${encodeURIComponent(slug)}`);
      const data = await res.json();
      if (!res.ok || !data.ok) {
        document.getElementById('loadingView').classList.add('hidden');
        document.getElementById('emptyView').classList.remove('hidden');
        document.getElementById('pageTitle').textContent = 'Update Not Found';
        document.getElementById('pageSub').textContent = `No update found with slug "${slug}".`;
        return;
      }
      showSingleUpdate(data.update);
    } catch(err) {
      document.getElementById('loadingView').classList.add('hidden');
      document.getElementById('emptyView').classList.remove('hidden');
    }
  } else {
    // Load updates list
    try {
      const res = await fetch(`${API_BASE}/api/updates`);
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error('Failed');
      showUpdatesList(data.updates || []);
    } catch(err) {
      document.getElementById('loadingView').classList.add('hidden');
      document.getElementById('emptyView').classList.remove('hidden');
    }
  }
}

init();
</script>
</body>
</html>
